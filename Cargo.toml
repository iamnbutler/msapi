[workspace]
resolver = "3"
members = ["crates/msapi-core", "crates/msapi-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
msapi-core = { path = "crates/msapi-core" }
# Keep this list short. Every crate here is a deliberate choice; see docs/dependencies.md.
foldhash = "0.2"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
