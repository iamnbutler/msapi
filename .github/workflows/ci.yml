name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Third-party crates in the normal and build graph; see docs/dependencies.md.
      DEPENDENCY_BUDGET: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mr-boxington-action@v1
      - run: cargo fmt --all --check
      - name: verification coverage
        run: python3 scripts/coverage.py --check
      - run: mbx clippy --workspace --all-targets -- -D warnings
      - run: mbx test --workspace
      - name: dependency budget
        run: |
          count=$(cargo tree -e normal,build --prefix none --format '{p}' | sed 's/ (.*//' | sort -u | grep -v '^msapi' | wc -l)
          echo "third-party crates: $count (budget $DEPENDENCY_BUDGET)"
          test "$count" -le "$DEPENDENCY_BUDGET"

  verify:
    # Machine-checked proofs of the formulas and token rules; see docs/verification.md.
    runs-on: ubuntu-latest
    env:
      VERUS_VERSION: 0.2026.10.18.7d82994
      VERUS_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v7
      - name: install verus
        run: |
          curl -fsSL -o "$RUNNER_TEMP/verus.zip" \
            "https://github.com/verus-lang/verus/releases/download/release/$VERUS_VERSION/verus-$VERUS_VERSION-x86-linux.zip"
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP/verus"
          dirname "$(find "$RUNNER_TEMP/verus" -name cargo-verus -type f | head -1)" >> "$GITHUB_PATH"
          rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal
      - name: cargo verus verify (msapi-core)
        working-directory: crates/msapi-core
        run: cargo verus verify --features verus
      - name: cargo verus verify (msapi-server)
        working-directory: crates/msapi-server
        run: cargo verus verify --features verus
